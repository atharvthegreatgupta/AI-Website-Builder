<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Paws - Find Your Furry Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Happy Paws</h1>
        <p>Find your perfect furry companion today!</p>
    </header>
    <main>
        <section class="dog-listings">
            <h2>Our Available Pups</h2>
            <div class="dog-card">
                <img src="https://via.placeholder.com/300x200?text=Golden+Retriever" alt="Golden Retriever puppy">
                <h3>Golden Retriever</h3>
                <p>Age: 10 weeks</p>
                <p class="price">$1200</p>
                <button>Adopt Me!</button>
            </div>
            <div class="dog-card">
                <img src="https://via.placeholder.com/300x200?text=French+Bulldog" alt="French Bulldog puppy">
                <h3>French Bulldog</h3>
                <p>Age: 8 weeks</p>
                <p class="price">$1800</p>
                <button>Adopt Me!</button>
            </div>
            <div class="dog-card">
                <img src="https://via.placeholder.com/300x200?text=Siberian+Husky" alt="Siberian Husky puppy">
                <h3>Siberian Husky</h3>
                <p>Age: 12 weeks</p>
                <p class="price">$1000</p>
                <button>Adopt Me!</button>
            </div>
            <div class="dog-card">
                <img src="https://via.placeholder.com/300x200?text=Poodle" alt="Poodle puppy">
                <h3>Poodle (Toy)</h3>
                <p>Age: 9 weeks</p>
                <p class="price">$1500</p>
                <button>Adopt Me!</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Happy Paws. All rights reserved.</p>
    </footer>
</body>
</html>
